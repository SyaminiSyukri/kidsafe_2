{% extends 'base.html' %}
{% block content %}

<div class="page-header">
    <div class="row align-items-center">
        <div class="col">
            <h3 class="page-title">Edit Subject</h3>
            <ul class="breadcrumb">
                <li class="breadcrumb-item"><a href="{% url 'view_subject' %}">Subjects</a></li>
                <li class="breadcrumb-item active">Edit Subject</li>
            </ul>
        </div>
        <div class="col-auto text-right float-right ml-auto">
            <a href="{% url 'view_subject' %}" class="btn btn-outline-primary mr-2"><i class="fas fa-times"></i> Cancel</a>
        </div>
    </div>
</div>

<div class="row">
    <div class="col-sm-12">
        <div class="card">
            <div class="card-body">
                <form method="post" action="{% url 'edit_subject' subject.id %}">
                    {% csrf_token %}
                    <div class="row">
                        <div class="col-12">
                            <h5 class="form-title"><span>Subject Information</span></h5>
                        </div>

                        <div class="col-12 col-sm-6">
                            <div class="form-group">
                                <label>Subject Name</label>
                                <input type="text" class="form-control" name="subject_name" value="{{ subject.name }}" required>
                            </div>
                        </div>

                        <div class="col-12 col-sm-6">
                            <div class="form-group">
                                <label>Teacher</label>
                                <select class="form-control" name="teacher_id" required>
                                    <option value="{{ subject.teacher.id }}" selected>{{ subject.teacher.admin.first_name }} {{ subject.teacher.admin.last_name }}</option>
                                    {% for teacher in teachers %}
                                    <option value="{{ teacher.id }}">{{ teacher.admin.first_name }} {{ teacher.admin.last_name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>

                        <div class="col-12">
                            <button type="submit" class="btn btn-primary">Update Subject</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
