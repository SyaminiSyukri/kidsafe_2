{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="page-header">
    <div class="row align-items-center">
        <div class="col">
            <h3 class="page-title">Scan and Add Balance</h3>
            <ul class="breadcrumb">
                <li class="breadcrumb-item"><a href="{% url 'admin_home' %}">Dashboard</a></li>
                <li class="breadcrumb-item active">Scan and Add Balance</li>
            </ul>
        </div>
    </div>
</div>

<!-- Success Message -->
<div id="success-message" class="alert alert-success mt-3" style="display: none;">
    <span id="success-text"></span>
</div>

<div class="row">
    <div class="col-sm-12">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">Scan Your Card to Add Balance</h5>

                <!-- Card ID Input -->
                <div class="form-group">
                    <label for="card-id">Card ID</label>
                    <input type="text" id="card-id" placeholder="Scan your card here" class="form-control" readonly>
                </div>

                <!-- Status Messages -->
                <div id="status-message" class="alert mt-3" style="display: none;"></div>

                <!-- Current Balance -->
                <div class="form-group">
                    <label for="current-balance">Current Balance</label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text">$</span>
                        </div>
                        <input type="text" id="current-balance" class="form-control" readonly>
                    </div>
                </div>

                <!-- Amount Input -->
                <div class="form-group">
                    <label for="amount">Amount to Add</label>
                    <input type="number" id="amount" class="form-control" placeholder="Enter amount" step="0.01"
                        min="0">
                </div>

                <!-- Add Balance Button -->
                <button type="button" class="btn btn-primary" id="add-balance-btn">Add Balance</button>

            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    $(document).ready(function () {
        // Function to automatically scan the card
        function scanCard() {
            $.ajax({
                url: "{% url 'read_card' %}",
                method: 'GET',
                headers: {
                    'X-Requested-With': 'XMLHttpRequest'
                },
                success: function (response) {
                    if (response.card_id) {
                        $('#card-id').val(response.card_id);

                        if (response.assigned) {
                            // Fetch the current balance for the student
                            $.ajax({
                                url: "{% url 'scan_and_add_balance' %}",
                                method: 'POST',
                                headers: {
                                    'X-Requested-With': 'XMLHttpRequest',
                                    'X-CSRFToken': '{{ csrf_token }}'
                                },
                                data: {
                                    card_id: response.card_id
                                },
                                success: function (balanceResponse) {
                                    if (balanceResponse.success) {
                                        // Display the current balance
                                        $('#current-balance').val(balanceResponse.current_balance);
                                        $('#status-message').removeClass('alert-danger').addClass('alert-info').text(`Card assigned to ${balanceResponse.student_name}`).show();
                                    } else {
                                        $('#status-message').removeClass('alert-info').addClass('alert-danger').text(balanceResponse.error).show();
                                    }
                                },
                                error: function (xhr) {
                                    $('#status-message').removeClass('alert-info').addClass('alert-danger').text('Error fetching balance.').show();
                                }
                            });
                        } else {
                            // If the card is not assigned, show an error
                            $('#status-message').removeClass('alert-info').addClass('alert-danger').text('This card is not assigned to a student.').show();
                        }
                    }
                },
                error: function (xhr) {
                    if (xhr.responseJSON && xhr.responseJSON.error) {
                        $('#status-message').removeClass('alert-info').addClass('alert-danger').text('Error: ' + xhr.responseJSON.error).show();
                    }
                }
            });
        }

        // Automatically scan card every 2 seconds
        setInterval(scanCard, 2000);

        // Add Balance Button
        $('#add-balance-btn').click(function () {
            const cardId = $('#card-id').val();
            const amount = $('#amount').val();

            if (!cardId) {
                $('#status-message').removeClass('alert-info').addClass('alert-danger').text('Please scan a card.').show();
                return;
            }

            if (!amount || amount <= 0) {
                $('#status-message').removeClass('alert-info').addClass('alert-danger').text('Please enter a valid amount.').show();
                return;
            }

            const confirmation = confirm(`Are you sure you want to add $${amount} to the balance?`);
            if (!confirmation) {
                return; // Exit if the user cancels
            }

            $.ajax({
                url: "{% url 'scan_and_add_balance' %}",
                method: 'POST',
                headers: {
                    'X-Requested-With': 'XMLHttpRequest',
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                data: {
                    card_id: cardId,
                    amount: amount
                },
                success: function (response) {
                    if (response.success) {
                        // Show success message and update the current balance
                        $('#success-text').text(response.message); // Set the dynamic message
                        $('#success-message').show();
                        $('#current-balance').val(response.new_balance);
                        $('#status-message').hide();
                    } else {
                        $('#status-message').removeClass('alert-info').addClass('alert-danger').text(response.error).show();
                    }
                },
                error: function (xhr) {
                    console.error(xhr); // Log the full error object to the console
                    const errorMessage = xhr.responseJSON && xhr.responseJSON.error ? xhr.responseJSON.error : 'An unknown error occurred.';
                    $('#status-message').removeClass('alert-info').addClass('alert-danger').text('Error: ' + errorMessage).show();
                }
            });
        });
    });
</script>
{% endblock %}
