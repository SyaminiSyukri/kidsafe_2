{% extends 'base.html' %}
{% block content %}
<div class="container">
    <h2>Scan Student Card</h2>
    <form id="scan-card-form" method="POST" action="{% url 'scan_card' %}">
        {% csrf_token %}
        <div class="form-group">
            <label for="card_id">Card ID</label>
            <input type="text" class="form-control" id="card_id" name="card_id" required>
        </div>
        <button type="submit" class="btn btn-primary">Scan</button>
    </form>
    <div id="scan-result" class="mt-3"></div>
</div>

<script>
    document.getElementById('scan-card-form').addEventListener('submit', function(event) {
        event.preventDefault();
        const form = event.target;
        const formData = new FormData(form);

        fetch(form.action, {
            method: 'POST',
            body: formData,
            headers: {
                'X-Requested-With': 'XMLHttpRequest',
            },
        })
        .then(response => response.json())
        .then(data => {
            const resultDiv = document.getElementById('scan-result');
            if (data.success) {
                resultDiv.innerHTML = `<div class="alert alert-success">${data.message}</div>`;
            } else {
                resultDiv.innerHTML = `<div class="alert alert-danger">${data.error}</div>`;
            }
        })
        .catch(error => {
            console.error('Error:', error);
        });
    });
</script>
{% endblock %}
