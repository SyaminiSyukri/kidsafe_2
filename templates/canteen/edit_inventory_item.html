{% extends 'base.html' %}
{% block content %}

<div class="row">
    <div class="col-sm-12">
        <div class="card">
            <div class="card-body">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="col-12">
                        <h5 class="form-title"><span>Edit Inventory Item</span></h5>
                    </div>

                    <!-- Current Image -->
                    <div class="col-sm-12 text-center mb-4">
                        {% if item.image %}
                            <img src="{{ item.image.url }}" alt="{{ item.name }}" class="img-fluid rounded" style="max-height: 200px; object-fit: cover;">
                        {% else %}
                            <div class="text-muted bg-light d-flex align-items-center justify-content-center" style="height: 150px;">
                                <i class="fas fa-image fa-3x"></i>
                            </div>
                        {% endif %}
                    </div>

                    <!-- Item Details in Table Layout -->
                    <div class="table-responsive">
                        <table class="table table-bordered">
                            <tbody>
                                <tr>
                                    <th scope="row" class="w-25">Name</th>
                                    <td><input type="text" class="form-control" name="name" value="{{ item.name }}" required></td>
                                </tr>
                                <tr>
                                    <th scope="row">Price</th>
                                    <td><input type="number" step="0.01" class="form-control" name="price" value="{{ item.price }}" required></td>
                                </tr>
                                <tr>
                                    <th scope="row">Description</th>
                                    <td><textarea class="form-control" name="description">{{ item.description }}</textarea></td>
                                </tr>
                                <tr>
                                    <th scope="row">Allergies</th>
                                    <td><input type="text" class="form-control" name="allergies" value="{{ item.allergies }}"></td>
                                </tr>
                                <tr>
                                    <th scope="row">Restrictions</th>
                                    <td><input type="text" class="form-control" name="restrictions" value="{{ item.restrictions }}"></td>
                                </tr>
                                <tr>
                                    <th scope="row">Update Image</th>
                                    <td>
                                        <div class="custom-file">
                                            <input type="file" class="form-control" name="image">
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Buttons -->
                    <div class="col-12 text-right mt-4">
                        <button type="submit" class="btn btn-primary">Update</button>
                        <a href="{% url 'inventory_item_detail' item.id %}" class="btn btn-secondary ml-2">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
