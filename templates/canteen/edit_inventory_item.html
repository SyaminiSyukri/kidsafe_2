{% extends 'base.html' %}
{% block content %}

<div class="row">
    <div class="col-sm-12">
        <div class="card">
            <div class="card-body">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="col-12">
                        <h5 class="form-title"><span>Edit Inventory Item</span></h5>
                    </div>

                    <!-- Current Image -->
                    <div class="col-sm-12 text-center mb-4">
                        {% if form.instance.image %}
                            <img src="{{ form.instance.image.url }}" alt="{{ form.instance.name }}" class="img-fluid rounded" style="max-height: 200px; object-fit: cover;">
                        {% else %}
                            <div class="text-muted bg-light d-flex align-items-center justify-content-center" style="height: 150px;">
                                <i class="fas fa-image fa-3x"></i>
                            </div>
                        {% endif %}
                    </div>

                    <!-- Item Details in Table Layout -->
                    <div class="table-responsive">
                        <table class="table table-bordered">
                            <tbody>
                                <tr>
                                    <th scope="row" class="w-25">Name</th>
                                    <td>{{ form.name }}</td>
                                </tr>
                                <tr>
                                    <th scope="row">Quantity</th>
                                    <td>{{ form.quantity }}</td>
                                </tr>
                                <tr>
                                    <th scope="row">Price</th>
                                    <td>{{ form.price }}</td>
                                </tr>
                                <tr>
                                    <th scope="row">Description</th>
                                    <td>{{ form.description }}</td>
                                </tr>
                                <tr>
                                    <th scope="row">Update Image</th>
                                    <td>
                                        <div class="custom-file">
                                            {{ form.image }}
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Buttons -->
                    <div class="col-12 text-right mt-4">
                        <button type="submit" class="btn btn-primary"></i> Update</button>
                        <a href="{% url 'inventory_item_detail' form.instance.id %}" class="btn btn-secondary ml-2">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
