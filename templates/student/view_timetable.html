{% extends 'base.html' %}
{% block content %}

<div class="page-header">
    <div class="row align-items-center">
        <div class="col">
            <h3 class="page-title">Timetable</h3>
            <ul class="breadcrumb">
                <li class="breadcrumb-item"><a href="{% url 'student_home' %}">Dashboard</a></li>
                <li class="breadcrumb-item active">Timetable</li>
            </ul>
        </div>
    </div>
</div>
{% include 'includes/messages.html' %}
<div class="row">
    <div class="col-sm-12">
        <div class="card">
            <div class="card-body">
                <div class="row">
                    {% for timetable in timetables %}
                    <div class="col-md-4 mb-4">
                        <div class="card">
                            <img src="{{ timetable.timetable_image.url }}" class="card-img-top" alt="{{ timetable.title }}" style="height: 200px; object-fit: cover;">
                            <div class="card-body">
                                <h5 class="card-title text-center">{{ timetable.title }}</h5>
                                <div class="text-center">
                                    <button type="button" class="btn btn-sm btn-info" data-toggle="modal" data-target="#imageModal{{ timetable.id }}">
                                        <i class="fas fa-expand"></i> View Full Picture
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Modal for Full Picture -->
                    <div class="modal fade" id="imageModal{{ timetable.id }}" tabindex="-1" role="dialog" aria-labelledby="imageModalLabel{{ timetable.id }}" aria-hidden="true">
                        <div class="modal-dialog modal-lg" role="document">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <h5 class="modal-title" id="imageModalLabel{{ timetable.id }}">{{ timetable.title }}</h5>
                                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                                        <span aria-hidden="true">&times;</span>
                                    </button>
                                </div>
                                <div class="modal-body text-center">
                                    <img src="{{ timetable.timetable_image.url }}" class="img-fluid" alt="{{ timetable.title }}">
                                </div>
                                <div class="modal-footer">
                                    <a href="{{ timetable.timetable_image.url }}" class="btn btn-success" download>
                                        <i class="fas fa-download"></i> Download
                                    </a>
                                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    {% empty %}
                    <div class="col-12">
                        <div class="alert alert-info">
                            No timetables found.
                        </div>
                    </div>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
