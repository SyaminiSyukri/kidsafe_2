{% extends 'base.html' %}
{% block content %}

<div class="page-header">
    <div class="row align-items-center">
        <div class="col">
            <h3 class="page-title">Add Exam Title</h3>
            <ul class="breadcrumb">
                <li class="breadcrumb-item"><a href="{% url 'teacher_home' %}">Dashboard</a></li>
                <li class="breadcrumb-item active">Add Exam Title</li>
            </ul>
        </div>
    </div>
</div>

<div class="row">
    <div class="col-sm-12">
        <div class="card">
            <div class="card-body">
                <form method="post" action="{% url 'add_exam_title' %}">
                    {% csrf_token %}
                    <div class="row">
                        <div class="col-12">
                            <h5 class="form-title"><span>Exam Title Information</span></h5>
                        </div>

                        <div class="col-12 col-sm-6">
                            <div class="form-group">
                                <label>Exam Title</label>
                                <input type="text" class="form-control" name="title" required>
                            </div>
                        </div>

                        <div class="col-12">
                            <button type="submit" class="btn btn-primary">Add Exam Title</button>
                            <a href="{% url 'add_exam_result' %}" class="btn btn-secondary">Cancel</a>
                        </div>
                    </div>
                </form>

                <!-- List of Exam Titles -->
                <div class="mt-4">
                    <h5 class="card-title">Exam Titles</h5>
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Title</th>
                                <th>Created At</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for title in exam_titles %}
                            <tr>
                                <td>{{ title.title }}</td>
                                <td>{{ title.created_at }}</td>
                                <td>
                                    <a href="{% url 'delete_exam_title' title.id %}" class="btn btn-sm btn-danger" onclick="return confirm('Are you sure you want to delete this exam title?');">
                                        <i class="fas fa-trash"></i>
                                    </a>
                                </td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
